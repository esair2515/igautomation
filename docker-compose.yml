services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: socialops
      POSTGRES_PASSWORD: socialops
      POSTGRES_DB: socialops
    ports: ["5432:5432"]
    volumes: ["socialops-postgres:/var/lib/postgresql/data"]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
volumes:
  socialops-postgres:
